name: Sync with Upstream
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: syncupstream-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
      commit: ${{ steps.merge.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Merge upstream
        id: merge
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add upstream https://github.com/Equicord/Equicord.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit upstream/main
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate merged source
        if: steps.merge.outputs.updated == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm testTsc
          pnpm buildStandalone
          pnpm buildWebStandalone
      - name: Push validated merge
        if: steps.merge.outputs.updated == 'true'
        run: git push origin HEAD:main
  release:
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.sync.outputs.commit }}

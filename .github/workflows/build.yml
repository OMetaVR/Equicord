name: Release
on:
    workflow_dispatch:
    workflow_call:
        inputs:
            ref:
                type: string
                required: true
    push:
        branches:
            - main

env:
    FORCE_COLOR: true

concurrency:
    group: fork-release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    Build:
        name: Build Equicord
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check types
              run: pnpm testTsc

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release

                  cp browser/browser.* release
                  cp Equicord.user.{js,js.LEGAL.txt} release
                  cp *.{json,zip,asar} release
                  cp desktop/* release

                  for file in equibop/*; do
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done

                  find release -size 0 -delete
                  rm -f release/package.json
                  rm -f release/*.map

            - name: Publish tested release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  commit=$(git rev-parse HEAD)
                  tag="build-$commit"
                  current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
                  if [ "$current" != "$commit" ]; then
                    echo "A newer commit is available; skipping this release."
                    exit 0
                  fi
                  if gh release view "$tag" >/dev/null 2>&1; then
                    if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false ]; then
                      echo "Release already exists: $tag"
                      exit 0
                    fi
                    gh release upload "$tag" dist/release/* --clobber
                  else
                    gh release create "$tag" dist/release/* --target "$commit" --title "Latest $commit" --notes "Validated desktop and web builds from $commit." --draft
                  fi
                  gh release edit "$tag" --draft=false --latest
